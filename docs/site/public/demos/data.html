<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Orb - data demo</title>
    <script src="../orb.min.js"></script>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600&display=swap" />
    <style>
      :root { --black:#231f20; --orange:#fb6e00; --g4:#e6e6e6; --g5:#f9f9f9; --g2:#646265; --bg:#ffffff; }
      :root[data-theme="dark"] { --black:#e6e6e6; --g4:#3a3536; --g5:#2b2727; --g2:#bab8bb; --bg:#231f20; }
      html, body { height:100%; margin:0; font-family:'Inter Tight',system-ui,sans-serif; color:var(--black); background:var(--bg); }
      .wrap { display:flex; flex-direction:column; height:100%; }
      .toolbar { display:flex; flex-wrap:wrap; gap:8px 12px; align-items:center; padding:12px 16px; border-bottom:1px solid var(--g4); background:var(--g5); }
      button { font-family:inherit; font-size:13px; font-weight:500; padding:6px 12px; border:1px solid var(--g4); border-radius:4px; background:var(--bg); color:var(--black); cursor:pointer; transition:all .12s ease; }
      button:hover { background:var(--g5); border-color:#bab8bb; }
      button.primary { background:var(--orange); border-color:var(--orange); color:#fff; }
      button.primary:hover { background:#e36300; border-color:#e36300; }
      .count { margin-left:auto; font-size:13px; color:var(--g2); }
      .count b { color:var(--black); font-variant-numeric:tabular-nums; }
      #graph { flex:1; width:100%; min-height:0; }
    </style>
  </head>
  <body>
    <div class="wrap">
      <div class="toolbar">
        <button class="primary" id="add">Add node</button>
        <button id="remove">Remove node</button>
        <button id="recolor">Recolor a node</button>
        <button id="reset">Reset</button>
        <span class="count"><b id="nc">0</b> nodes &nbsp; <b id="ec">0</b> edges</span>
      </div>
      <div id="graph"></div>
    </div>

    <script>
      const container = document.getElementById('graph');
      let __dark = false;
      const labelColor = () => (__dark ? '#e6e6e6' : '#231f20');
      const orb = new Orb.OrbView(container);
      window.__orbSetTheme = (dark) => {
        __dark = !!dark;
        document.documentElement.dataset.theme = __dark ? 'dark' : 'light';
        orb.data.getNodes().forEach((n) => n.patchStyle({ fontColor: labelColor() }, { isNotifySkipped: true }));
        orb.render();
      };
      // Refit whenever the (async) force layout settles - including after every
      // add/remove/merge, which re-runs the simulation by default. Recentering in
      // render()'s callback fires too early (before the worker positions nodes).
      orb.events.on(Orb.OrbEventType.SIMULATION_END, () => orb.recenter());
      let nextId = 0;

      orb.data.setDefaultStyle({
        getNodeStyle(node) {
          return { size: 8, color: node.getData().color || '#fb6e00', borderColor: '#e36300', borderWidth: 1, label: node.getData().label, fontSize: 4, fontColor: labelColor() };
        },
        getEdgeStyle() {
          return { color: '#bab8bb', width: 0.5 };
        },
      });

      function counts() {
        document.getElementById('nc').textContent = orb.data.getNodeCount();
        document.getElementById('ec').textContent = orb.data.getEdgeCount();
      }

      function reset() {
        nextId = 0;
        const nodes = [];
        const edges = [];
        for (let i = 0; i < 5; i++) {
          const id = nextId++;
          nodes.push({ id, label: 'N' + id });
          if (i > 0) edges.push({ id: 'e' + id, start: id, end: Math.floor(Math.random() * i) });
        }
        orb.data.setup({ nodes, edges });
        orb.render();
        counts();
      }

      document.getElementById('add').addEventListener('click', () => {
        const existing = orb.data.getNodes();
        if (!existing.length) return reset();
        const id = nextId++;
        const target = existing[Math.floor(Math.random() * existing.length)].getId();
        // `merge` adds new nodes/edges (and would update any with a matching id).
        orb.data.merge({ nodes: [{ id, label: 'N' + id }], edges: [{ id: 'e' + id, start: id, end: target }] });
        orb.render();
        counts();
      });

      document.getElementById('remove').addEventListener('click', () => {
        const nodes = orb.data.getNodes();
        if (!nodes.length) return;
        const victim = nodes[Math.floor(Math.random() * nodes.length)].getId();
        // Removing a node also removes its connected edges.
        orb.data.remove({ nodeIds: [victim] });
        orb.render();
        counts();
      });

      document.getElementById('recolor').addEventListener('click', () => {
        const nodes = orb.data.getNodes();
        if (!nodes.length) return;
        const node = nodes[Math.floor(Math.random() * nodes.length)];
        const palette = ['#fb6e00', '#231f20', '#19af66', '#dd2222', '#8c0082'];
        const color = palette[Math.floor(Math.random() * palette.length)];
        // Persist on data so the default-style callback keeps it on re-render.
        node.patchData({ color });
        node.patchStyle({ color });
        orb.render();
      });

      document.getElementById('reset').addEventListener('click', reset);

      reset();
    </script>
  </body>
</html>
